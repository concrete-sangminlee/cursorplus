version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # Group all minor/patch bumps into a single PR per ecosystem to keep noise low.
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      # Major bumps still get their own PR so they can be evaluated individually.
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types:
          - minor
          - patch
