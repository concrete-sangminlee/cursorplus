name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify release version and tag format
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME#v}"
          export TAG_NAME
          PKG_NAME="$(node -p "require('./package.json').name")"
          LOCKFILE_NAME="$(node -p "require('./package-lock.json').name")"
          if [ "$PKG_NAME" != "$LOCKFILE_NAME" ]; then
            echo "package.json name ($PKG_NAME) does not match package-lock.json name ($LOCKFILE_NAME)."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$TAG_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag '$TAG_NAME' is not valid SemVer."
            exit 1
          fi
          if [ "$TAG_NAME" != "$PKG_VERSION" ]; then
            echo "Release tag ($TAG_NAME) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          LOCKFILE_VERSION="$(node -p "require('./package-lock.json').version")"
          if [ "$TAG_NAME" != "$LOCKFILE_VERSION" ]; then
            echo "Release tag ($TAG_NAME) does not match package-lock.json version ($LOCKFILE_VERSION)"
            exit 1
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md is missing; required for release traceability."
            exit 1
          fi

          if ! node - "$TAG_NAME" <<'NODE'
          const fs = require('node:fs')
          const tag = process.argv[2]
          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          const headingRegex = new RegExp(`^#{2,4}\\s+\\[?v?${escapeRegExp(tag)}\\]?\\b`)

          const body = fs.readFileSync('CHANGELOG.md', 'utf8')
          const found = body
            .split(/\r?\n/)
            .some((line) => headingRegex.test(line))
          if (!found) {
            console.error(`CHANGELOG.md does not contain a release heading for ${tag}`)
            process.exit(1)
          }
          NODE
          then
            exit 1
          fi

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if [ -n "$NPM_TOKEN" ] && npm view "$PACKAGE_NAME@$TAG_NAME" version >/dev/null 2>&1; then
            echo "Version $TAG_NAME already exists in npm registry for $PACKAGE_NAME."
            echo "Refusing to publish an already-released version."
            exit 1
          fi

      - name: Verify release tag is on default branch history
        run: |
          BASE_BRANCH="origin/${DEFAULT_BRANCH:-main}"
          if [ -z "$(git branch -r --list "$BASE_BRANCH")" ]; then
            echo "Base branch ref '$BASE_BRANCH' not found; expected branch '${DEFAULT_BRANCH:-main}'."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$BASE_BRANCH" "$GITHUB_SHA"; then
            echo "Tag commit ($GITHUB_SHA) is not on $BASE_BRANCH history."
            echo "Skip release from non-default-branch commit to avoid publishing detached tags."
            exit 1
          fi
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run test:cli
      - run: npm run build
      - run: npm run cli:build
      - run: node dist-cli/index.mjs --version
      - run: node dist-cli/index.mjs --help
      - name: Validate npm pack payload
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          npm pack --json --dry-run > /tmp/npm-pack.json
          node scripts/validate-npm-pack.mjs --pack-json /tmp/npm-pack.json --expected-version "$VERSION"
      - name: Publish npm package
        if: env.NPM_TOKEN != ''
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Skip npm publish
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not configured; skipping npm publish."
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
