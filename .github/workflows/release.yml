name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify release version and tag format
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME#v}"
          export TAG_NAME
          PKG_NAME="$(node -p "require('./package.json').name")"
          LOCKFILE_NAME="$(node -p "require('./package-lock.json').name")"
          if [ "$PKG_NAME" != "$LOCKFILE_NAME" ]; then
            echo "package.json name ($PKG_NAME) does not match package-lock.json name ($LOCKFILE_NAME)."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$TAG_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag '$TAG_NAME' is not valid SemVer."
            exit 1
          fi
          if [ "$TAG_NAME" != "$PKG_VERSION" ]; then
            echo "Release tag ($TAG_NAME) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          LOCKFILE_VERSION="$(node -p "require('./package-lock.json').version")"
          if [ "$TAG_NAME" != "$LOCKFILE_VERSION" ]; then
            echo "Release tag ($TAG_NAME) does not match package-lock.json version ($LOCKFILE_VERSION)"
            exit 1
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md is missing; required for release traceability."
            exit 1
          fi

          if ! node - "$TAG_NAME" <<'NODE'
          const fs = require('node:fs')
          const tag = process.argv[2]
          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          const headingRegex = new RegExp(`^#{2,4}\\s+\\[?v?${escapeRegExp(tag)}\\]?\\b`)

          const body = fs.readFileSync('CHANGELOG.md', 'utf8')
          const found = body
            .split(/\r?\n/)
            .some((line) => headingRegex.test(line))
          if (!found) {
            console.error(`CHANGELOG.md does not contain a release heading for ${tag}`)
            process.exit(1)
          }
          NODE
          then
            exit 1
          fi

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if [ -n "$NPM_TOKEN" ] && npm view "$PACKAGE_NAME@$TAG_NAME" version >/dev/null 2>&1; then
            echo "Version $TAG_NAME already exists in npm registry for $PACKAGE_NAME."
            echo "Refusing to publish an already-released version."
            exit 1
          fi

      - name: Verify release tag is on default branch history
        run: |
          BASE_BRANCH="origin/${DEFAULT_BRANCH:-main}"
          if [ -z "$(git branch -r --list "$BASE_BRANCH")" ]; then
            echo "Base branch ref '$BASE_BRANCH' not found; expected branch '${DEFAULT_BRANCH:-main}'."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$BASE_BRANCH" "$GITHUB_SHA"; then
            echo "Tag commit ($GITHUB_SHA) is not on $BASE_BRANCH history."
            echo "Skip release from non-default-branch commit to avoid publishing detached tags."
            exit 1
          fi
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run test:cli
      - run: npm run build
      - run: npm run cli:build
      - run: node dist-cli/index.mjs --version
      - run: node dist-cli/index.mjs --help
      - name: Validate npm pack payload
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          NODE_NAME_SAFE="${PACKAGE_NAME#@}"
          NODE_NAME_SAFE="${NODE_NAME_SAFE//@/-}"
          NODE_NAME_SAFE="${NODE_NAME_SAFE//\//-}"

          npm pack --json --dry-run > /tmp/npm-pack.json

          node - "$PACKAGE_NAME" "$VERSION" "$NODE_NAME_SAFE" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const packageName = process.argv[2]
          const version = process.argv[3]
          const safeName = process.argv[4]
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const packJson = fs.readFileSync('/tmp/npm-pack.json', 'utf8')
          const parsed = JSON.parse(packJson)
          const entry = Array.isArray(parsed) ? parsed[0] : parsed

          if (!entry || typeof entry !== 'object') {
            console.error('Unable to parse npm pack JSON output.')
            process.exit(1)
          }

          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          const normalizePath = (value) => String(value || '').replace(/^\.\/+/, '')
          const toRegexFromGlob = (pattern) => {
            const escaped = escapeRegExp(pattern)
              .replace(/\\\*/g, '.*')
              .replace(/\\\?/g, '.')
            return new RegExp(`^${escaped}$`)
          }
          const hasPackedMatch = (packFiles, pattern) => {
            const normalized = normalizePath(pattern)
            if (!normalized) return false
            if (packFiles.has(normalized)) return true
            const directoryPrefix = normalized.endsWith('/') ? normalized : `${normalized}/`
            if ([...packFiles].some((file) => file.startsWith(directoryPrefix))) {
              return true
            }
            if (/[*!?]/.test(normalized)) {
              const globExp = toRegexFromGlob(normalized)
              return [...packFiles].some((file) => globExp.test(file))
            }
            return false
          }
          const binEntries = (bin) => {
            if (typeof bin === 'string') return [bin]
            if (bin && typeof bin === 'object') return Object.values(bin)
            return []
          }

          const expectedFiles = new Set([
            'LICENSE',
            'README.md',
            'CHANGELOG.md',
            'SECURITY.md',
            'package.json',
            'dist-cli/index.mjs',
          ])
          if (packageJson.main) expectedFiles.add(packageJson.main)
          binEntries(packageJson.bin).forEach((binEntry) => expectedFiles.add(binEntry))
          if (packageJson.files && Array.isArray(packageJson.files) && packageJson.files.length > 0) {
            packageJson.files.forEach((entry) => expectedFiles.add(entry))
          }

          const entryFiles = new Set(
            (entry.files || [])
              .map((item) => (typeof item === 'string' ? item : item.path))
              .map(normalizePath),
          )
          const normalizedExpectedFiles = [...expectedFiles].map(normalizePath)
          const missingFiles = normalizedExpectedFiles
            .filter((file) => !hasPackedMatch(entryFiles, file))
            .sort()

          if (missingFiles.length > 0) {
            console.error(`npm pack is missing required files: ${missingFiles.join(', ')}`)
            process.exit(1)
          }

          const missingShebangs = binEntries(packageJson.bin)
            .map(normalizePath)
            .filter((binEntry) => {
              if (!binEntry || !fs.existsSync(binEntry)) return true
              return !fs.readFileSync(binEntry, 'utf8').startsWith('#!')
            })

          if (missingShebangs.length > 0) {
            console.error(`npm binary files must exist and start with a shebang: ${missingShebangs.join(', ')}`)
            process.exit(1)
          }

          const expectedFilename = `${safeName}-${version}.tgz`
          const actualFilename = path.basename(entry.filename || '')
          if (actualFilename !== expectedFilename) {
            console.error(`Unexpected pack filename: expected ${expectedFilename}, got ${actualFilename}`)
            process.exit(1)
          }

          if (packageName.startsWith('@')) {
            if (!actualFilename.startsWith(safeName)) {
              console.error(`Scoped package naming mismatch in packed filename: ${actualFilename}`)
              process.exit(1)
            }
          } else if (!actualFilename.startsWith(`${packageName}-`)) {
            console.error(`Packed filename does not start with package name: ${actualFilename}`)
            process.exit(1)
          }

          if (!Array.isArray(entry.files) || entry.files.length === 0) {
            console.error('npm pack output is missing file list metadata.')
            process.exit(1)
          }

          if (entry.name !== packageName) {
            console.error(`Packed package name mismatch: expected ${packageName}, got ${entry.name}`)
            process.exit(1)
          }

          if (entry.version !== version) {
            console.error(`Packed package version mismatch: expected ${version}, got ${entry.version}`)
            process.exit(1)
          }

          if (!entry.integrity && process.env.ACTIONS_STEP_DEBUG !== 'true') {
            console.info('No integrity hash is reported in npm pack output; continuing with available metadata.')
          }

          console.log(`npm pack validation passed for ${packageName}@${version}`)
          console.log(`Expected files present: ${normalizedExpectedFiles.sort().join(', ')}`)
          console.log(`Packed file count: ${(entry.files || []).length}`)
          NODE
      - name: Publish npm package
        if: env.NPM_TOKEN != ''
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Skip npm publish
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not configured; skipping npm publish."
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
