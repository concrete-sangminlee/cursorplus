name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify release context
        run: npm run release:validate -- --tag "${GITHUB_REF_NAME}" --changelog CHANGELOG.md --npm-token "${NPM_TOKEN}"

      - name: Verify release tag is on default branch history
        run: |
          BASE_BRANCH="origin/${DEFAULT_BRANCH:-main}"
          if [ -z "$(git branch -r --list "$BASE_BRANCH")" ]; then
            echo "Base branch ref '$BASE_BRANCH' not found; expected branch '${DEFAULT_BRANCH:-main}'."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$BASE_BRANCH" "$GITHUB_SHA"; then
            echo "Tag commit ($GITHUB_SHA) is not on $BASE_BRANCH history."
            echo "Skip release from non-default-branch commit to avoid publishing detached tags."
            exit 1
          fi
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run test:cli
      - run: npm run build
      - run: npm run cli:build
      - run: node dist-cli/index.mjs --version
      - run: node dist-cli/index.mjs --help
      - name: Validate npm pack payload
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          npm pack --json --dry-run > /tmp/npm-pack.json
          node scripts/validate-npm-pack.mjs --pack-json /tmp/npm-pack.json --expected-version "$VERSION"
      - name: Publish npm package
        if: env.NPM_TOKEN != ''
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Skip npm publish
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not configured; skipping npm publish."
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
