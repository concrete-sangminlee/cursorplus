name: Dependabot PR Guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  annotate:
    if: github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.event.pull_request.head.ref, 'dependabot/')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
          const scopeHint = (filePath) => {
            const file = (filePath || '').toLowerCase()
            if (/(^|[\\/])(package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?)($|[\\/])/.test(file)) {
              return 'runtime'
            }
            if (/(^|[\\/])(dev|peer)-dependencies($|[\\/])/i.test(file) || /^tests?[\\/]/i.test(file) || /(^|[\\/])test[\\/]/i.test(file)) {
              return 'dev'
            }
            if (/\.d\.ts$/.test(file) || /(^|[\\/])(types|typings|typescript)([\\/]|$)/i.test(file)) {
              return 'types'
            }
            return null
          }

            const pullRequest = context.payload.pull_request
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = context.issue.number
            const marker = '<!-- dependabot-pr-guard -->'
            const title = pullRequest.title || ''
            const body = pullRequest.body || ''
            const isSecurityUpdate = /security|cve|vulnerability/i.test(title) || /security/i.test(body)
            const isMajorUpdate = /major|breaking/i.test(title)
            const scopeSet = new Set()
            const labelSet = new Set(['dependencies', 'dependabot'])

            if (isSecurityUpdate) labelSet.add('security')
            if (isMajorUpdate) labelSet.add('semver-major')
            if (isSecurityUpdate) scopeSet.add('security')

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            })
            const touchedFiles = changedFiles
              .map((item) => (item.filename || '').toLowerCase())
              .filter(Boolean)
            const uniqueTouches = [...new Set(touchedFiles)]

            for (const changed of uniqueTouches) {
              const hint = scopeHint(changed)
              if (hint) {
                scopeSet.add(hint)
                labelSet.add(hint === 'security' ? 'security' : hint)
              }
            }

            const touched = uniqueTouches.join('\n')

            if (/\bpackage(-lock)?\.json\b/.test(touched) || /deps?\b/.test(touched)) {
              labelSet.add('runtime')
            }
            if (/(^|\b)dev\b|dev-dependencies|peer-dependencies|test/.test(touched)) {
              labelSet.add('dev')
            }
            if (/\btypes\b|d\.ts|typescript/.test(touched)) {
              labelSet.add('types')
            }
            if (scopeSet.has('security')) {
              labelSet.add('security')
            }

            const normalizedLabels = [...labelSet].sort()
            const scopeList = [...scopeSet]
              .filter(Boolean)
              .sort()
            const normalizedScope = scopeList.length > 0
              ? scopeList.join(', ')
              : 'unclassified'
            const changedSummary = uniqueTouches.slice(0, 20).join(', ') || 'no files'
            const touchedCount = uniqueTouches.length
            const changedFilesSummary = `${changedSummary}${touchedCount > 20 ? ` (and ${touchedCount - 20} more)` : ''}`
            const clippedSummary = changedFilesSummary.length > 1200
              ? `${changedFilesSummary.slice(0, 1180)}...`
              : changedFilesSummary

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: normalizedLabels,
              })
            } catch (error) {
              core.info(`Skipping label update: ${error.message}`)
            }

            const existing = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100,
              }
            )

            if (existing.some((comment) => comment.body?.includes(marker))) {
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `${marker}
            ## Dependabot dependency update

            This PR was opened by Dependabot. Please confirm:

            - [ ] Dependency impact and license changes are reviewed.
            - [ ] Dependency files touched align with `runtime`, `dev`, or `types` scope.
            - [ ] Security update scope is confirmed: **${scopeSet.has('security') ? 'Yes' : 'No'}**.
            - [ ] Any security implications are called out in the PR description.
            - [ ] Scope of change matches dependency bump intent (runtime/dev/types).
            - [ ] Release notes/changelog is updated when user-visible behavior changes.
            - [ ] Scope: **[scope: ${normalizedScope}]**
            - [ ] Suggested touched files: ${clippedSummary}
            `
            })
