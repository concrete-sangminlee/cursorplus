name: Dependabot PR Guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  annotate:
    if: github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.event.pull_request.head.ref, 'dependabot/')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = context.issue.number
            const marker = '<!-- dependabot-pr-guard -->'
            const title = pullRequest.title || ''
            const body = pullRequest.body || ''
            const labels = ['dependencies', 'dependabot']
            const isSecurityUpdate = /security|cve|vulnerability/i.test(title) || /security/i.test(body)
            const isMajorUpdate = /major|breaking/i.test(title)

            if (isSecurityUpdate) labels.push('security')
            if (isMajorUpdate) labels.push('semver-major')

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            })
            const touched = changedFiles
              .map((item) => (item.filename || '').toLowerCase())
              .join('\n')

            if (/\bpackage(-lock)?\.json\b/.test(touched) || /deps?\b/.test(touched)) {
              labels.push('runtime')
            }
            if (/(^|\b)dev\b|dev-dependencies|peer-dependencies|test/.test(touched)) {
              labels.push('dev')
            }
            if (/\btypes\b|d\.ts|typescript/.test(touched)) {
              labels.push('types')
            }

            const uniqueLabels = [...new Set(labels)]

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: uniqueLabels,
              })
            } catch (error) {
              core.info(`Skipping label update: ${error.message}`)
            }

            const existing = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100,
              }
            )

            if (existing.some((comment) => comment.body?.includes(marker))) {
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `${marker}
            ## Dependabot dependency update

            This PR was opened by Dependabot. Please confirm:

            - [ ] Dependency impact and license changes are reviewed.
            - [ ] Any security implications are called out in the PR description.
            - [ ] Scope of change matches dependency bump intent (runtime/dev/types).
            - [ ] Release notes/changelog is updated when user-visible behavior changes.
            `
            })
