name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'electron/**'
      - 'src/**'
      - 'cli/**'
      - 'scripts/**'
      - 'shared/**'
      - 'build/**'
      - 'dist-electron/**'
      - 'dist-cli/**'
      - 'public/**'
      - 'electron-builder.yml'
      - '.npmignore'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'electron/**'
      - 'src/**'
      - 'cli/**'
      - 'scripts/**'
      - 'shared/**'
      - 'build/**'
      - 'dist-electron/**'
      - 'dist-cli/**'
      - 'public/**'
      - 'electron-builder.yml'
      - '.npmignore'
      - '.github/workflows/*.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [audit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run test:cli
      - run: npm run build
      - run: npm run release:validate-pack

  cli-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [audit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run cli:build
      - run: node dist-cli/index.mjs --version
      - run: node dist-cli/index.mjs --help
